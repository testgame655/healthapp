apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: bbhealthapp
  labels:
    app: document-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
        tier: backend
    spec:
      containers:
      - name: document-service
        image: fhodam/healthapp-document-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
          name: http
        env:
        - name: SERVER_PORT
          value: "8083"
        - name: TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: TOKEN_SECRET_DOCUMENT
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_PROFILES_ACTIVE
        - name: FILE_UPLOAD_DIR
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: FILE_UPLOAD_DIR
        - name: SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE
        - name: SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE
        - name: MASTER_SVC_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MASTER_SVC_HOST
        - name: MASTER_SVC_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MASTER_SVC_PORT
        volumeMounts:
        - name: uploads-volume
          mountPath: /app/useruploads
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: uploads-pvc
