apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: bbhealthapp
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        upstream master-service {
            server master-service:8081;
        }

        upstream register-service {
            server register-service:8082;
        }

        upstream document-service {
            server document-service:8083;
        }

        server {
            listen 80;
            server_name localhost;

            location / {
                root /usr/share/nginx/html;
                index index.html index.htm;
                try_files $uri $uri/ /index.html;
            }

            location /api/ {
                proxy_pass http://master-service/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location /register/ {
                proxy_pass http://register-service/register/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location /document/ {
                proxy_pass http://document-service/document/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }
    }
