apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: bbhealthapp
data:
  MASTER_SVC_HOST: "master-service"
  MASTER_SVC_PORT: "8081"
  REGISTER_SVC_HOST: "register-service"
  REGISTER_SVC_PORT: "8082"
  DOCUMENT_SVC_HOST: "document-service"
  DOCUMENT_SVC_PORT: "8083"
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_H2_CONSOLE_ENABLED: "true"
  SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/binarybrainscovid"
  SPRING_DATASOURCE_USERNAME: "sa"
  SPRING_DATASOURCE_PASSWORD: "sa"
  FILE_UPLOAD_DIR: "/app/useruploads"
  SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "20MB"
  SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "20MB"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
